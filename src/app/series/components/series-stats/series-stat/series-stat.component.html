<div class="li-pair">
    <h4>
        {{ statTitle() }}
    </h4>

    @for (e of stat(); track e.playerName; let i = $index; ) {
        <span
            class="smaller"
            [class.inactive]="e.inactive"
        >
            <span
                class="truncate"
                [class.flex-57]="!e.addValue"
                [class.flex-1]="e.addValue"
            >
                    {{ i + 1 }}.

                @if (!e.addValue) {
                    <app-user-image-round [borderWidth]="2" [imageUrl]="e.image" [size]="20"/>
                }

                {{ e.playerName }}
            </span>

            <span
                class="flex-right"
                [class.flex-40]="!e.addValue"
                [class.flex-0]="e.addValue"
            >
                @if (useNumberPipe()) {
                    <strong>{{ e.value | number:'1.1-1' }} </strong> ({{ e.played }})
                } @else {
                    @if (e.addValue === undefined) {
                        <strong>{{ e.value }}</strong>
                    }
                    ({{ e.played }})
                }
            </span>
        </span>
    }
</div>
