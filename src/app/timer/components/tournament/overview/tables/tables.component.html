<div class="inner-container">
    <h3>
        Tables
    </h3>

    @if (tableDraw() !== undefined) {
        <div class="overflow-y-auto background-panel">
            <div id="topr"></div>

            <div class="tables-wrapper">
                @for (table of tableDraw()!.tables; track table; let i = $index) {
                    <div class="table">
                        <h4>Table {{ table.tableName }}</h4>
                        <div class="table-content">

                            @for (player of table.seats; track player; let j = $index; ) {
                                <div
                                    class="seat"
                                    [class.fixed]="player.isFixedSeat"
                                    [class.eliminated]="player.isEliminated"
                                >
                                    <div class="position">
                                        <div>
                                        <span>
                                            {{ player.seatNo + 1 }}
                                        </span>
                                        </div>
                                    </div>

                                    <p>
                                        {{ player?.player?.name }}
                                    </p>

                                    @if (player.isButton) {
                                        <div class="button">B</div>
                                    }
                                </div>
                            }
                        </div>
                    </div>
                }
            </div>

            <div id="bottomr"></div>
        </div>
    }
</div>
